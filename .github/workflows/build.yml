name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK + version info
        if: github.event_name != 'pull_request'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk eglo-ble-bridge.apk
          jq -n --argjson code "${{ github.run_number }}" --arg name "0.1.${{ github.run_number }}" \
            --arg notes "$(git log -1 --pretty=%s)" \
            '{versionCode: $code, versionName: $name, notes: $notes}' > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: eglo-ble-bridge-apk
          path: eglo-ble-bridge.apk

      - name: Publish "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest eglo-ble-bridge.apk version.json \
            --title "EGLO BLE Bridge (Build ${{ github.run_number }})" \
            --notes "Automatischer Build von ${{ github.sha }}. Auf dem Tablet herunterladen und installieren." \
            --target ${{ github.sha }}
