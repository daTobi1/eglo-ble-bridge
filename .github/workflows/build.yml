name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk eglo-ble-bridge.apk

      - uses: actions/upload-artifact@v4
        with:
          name: eglo-ble-bridge-apk
          path: eglo-ble-bridge.apk

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest eglo-ble-bridge.apk \
            --title "EGLO BLE Bridge (Build ${{ github.run_number }})" \
            --notes "Automatischer Build von ${{ github.sha }}. Auf dem Tablet herunterladen und installieren." \
            --target ${{ github.sha }}
